html{font-size:17px}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);line-height:1.55;
 padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

@media (max-width:520px){html{font-size:16px}}

</style><nav class="sn" aria-label="Điều hướng chính"><a class="br" href="index.html">Physics <b>EZ</b></a><a href="index.html">Trang chủ</a><a href="thi-nghiem.html" aria-current="page">Thí nghiệm mô phỏng gần gũi</a><a href="tro-li-ao.html">Trợ lí AI soạn câu lệnh cho giáo viên</a><a href="quan-ly.html" class="up">Tải lên</a><button type="button" class="mode js-mode" aria-label="Đổi giao diện sáng tối">Chế độ sáng</button></nav><script>
(function(){var r=document.documentElement,k='physics-ez.theme',t='dark';
try{t=localStorage.getItem(k)||'dark'}catch(e){}
r.setAttribute('data-theme',t);
function lab(btn){btn.textContent=(r.getAttribute('data-theme')==='light')?'Chế độ tối':'Chế độ sáng'}
function wire(){var bs=document.querySelectorAll('.js-mode');for(var i=0;i<bs.length;i++){(function(b){lab(b);b.addEventListener('click',function(){var n=r.getAttribute('data-theme')==='light'?'dark':'light';r.setAttribute('data-theme',n);try{localStorage.setItem(k,n)}catch(e){}var all=document.querySelectorAll('.js-mode');for(var j=0;j<all.length;j++)lab(all[j])})})(bs[i])}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wire);else wire();
})();
</script>

</div>
<script src="ez.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),fr=document.getElementById('fr'),err=document.getElementById('err');
  function bad(t){fr.hidden=true;err.hidden=false;err.textContent=t}
  var f=q.get('f'),id=q.get('id');
  if(f){
    if(!/^[A-Za-z0-9._-]+\.html$/.test(f)){bad('Đường dẫn bài không hợp lệ.');return}
    document.getElementById('ttl').textContent=f;fr.src=f;
  }else if(id){
    EZ.local().then(function(a){var it=a.filter(function(x){return x.id===id})[0];if(!it){bad('Không tìm thấy bài này trên máy. Có thể nó đã bị xóa.');return}
      document.getElementById('ttl').textContent=it.title;document.title=it.title+' · Physics EZ';
      EZ.file(it.file).then(function(h){if(!h){bad('Không đọc được file của bài.');return}fr.srcdoc=h})
    },function(){bad('Trình duyệt không cho đọc nội dung đã lưu. Hãy mở web đã tải về hoặc đã đăng.')})
  }else bad('Chưa chọn bài nào.');
})();
</script>
